services:
  app_nodejs:
    build:
      context: ./uegg_backend
      dockerfile: Dockerfile.dev
    container_name: nodejs_app
    working_dir: /app
    volumes:
      - ./uegg_backend:/app
      - /app/node_modules 
    ports:
      - "3000:3000"
    depends_on:
      - db
  app_vuejs:
    build:
      context: ./uegg_frontend
      dockerfile: Dockerfile.dev
    container_name: vuejs_app
    working_dir: /app
    volumes:
      - ./uegg_frontend/vuejs:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    depends_on:
      - app_nodejs
  db:
    image: postgres:15
    container_name: base_datos_pg
    environment:
      POSTGRES_DB: db_developer
      POSTGRES_USER: dba
      POSTGRES_PASSWORD: sys
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data

volumes:
  pgdata:
