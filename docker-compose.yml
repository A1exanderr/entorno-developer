networks:
  networdpress:
    external: true

services:
  app_sistema:
    build:
      context: ./php
    container_name: app_sistema
    working_dir: /var/www/html
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db_sistema
    networks:
      - networdpress
  nginx_sistema:
    image: nginx:latest
    container_name: nginx_sistema
    #ports:
    #  - "80:80"
    volumes:
      - ./src:/var/www/html
      - ./nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app_sistema
    networks:
      - networdpress
  db_sistema:
    image: mariadb:10.11
    container_name: db_sistema
    environment:
      MARIADB_ROOT_PASSWORD: rootpass
      MARIADB_DATABASE: laravel
      MARIADB_USER: dba
      MARIADB_PASSWORD: sys
    #ports:
    #  - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    networks:
      - networdpress
volumes:
  mariadb_data:
