services:
  #db_ce:
  #  image: postgres:15
  #  container_name: db_ce
  #  environment:
  #    POSTGRES_DB: db_developer
  #    POSTGRES_USER: dba
  #    POSTGRES_PASSWORD: sys
  #  ports:
  #    - "5432:5432"
  #  volumes:
  #    - pgce:/var/lib/postgresql/data
  db_ce:
    image: postgis/postgis:17-3.4
    container_name: db_ce
    environment:
      POSTGRES_DB: db_developer
      POSTGRES_USER: dba
      POSTGRES_PASSWORD: sys
    ports:
      - "5432:5432"
    volumes:
      - pgce:/var/lib/postgresql/data
  backend_ce:
    build:
      context: ./src/backend
      dockerfile: ../../Dockerfile.nodejs.dev
    container_name: backend_ce
    working_dir: /app
    volumes:
      - ./src/backend:/app
      - /app/node_modules
    ports:
      - "3000:3000"
    depends_on:
      - db_ce
  frontend_ce:
    build:
      context: ./src/frontend
      dockerfile: ../../Dockerfile.angular.dev
    container_name: frontend_ce
    working_dir: /app
    volumes:
      - ./src/frontend:/app
      - /app/node_modules
    ports:
      - "80:4200"
    depends_on:
      - backend_ce
volumes:
  pgce: