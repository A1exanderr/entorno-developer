<div class="login-container">
  <p-card class="login-card">
    <ng-template pTemplate="header">
      <div class="login-header">
        <i class="pi pi-user"></i>
        <h2>INICIAR SESSIÓN</h2>
        <span>Bienvenido nuevamente</span>
      </div>
    </ng-template>

    <div class="p-fluid">
      <div class="field">
        <p-inputgroup>
          <p-inputgroup-addon>
              <i class="pi pi-envelope"></i>
          </p-inputgroup-addon>
          <p-floatlabel variant="on">
            <input pInputText id="on_label" [(ngModel)]="email" autocomplete="off" />
            <label for="on_label">Correo electrónico</label>
          </p-floatlabel>
        </p-inputgroup>
      </div>

      <div class="field">
        <p-inputgroup>
          <p-inputgroup-addon>
              <i class="pi pi-lock"></i>
          </p-inputgroup-addon>
          <p-floatlabel variant="on">
            <p-password
              [(ngModel)]="password"
              [feedback]="false"
              toggleMask="true"
              >
            </p-password>
            <label for="on_label">Contraseña</label>
          </p-floatlabel>
        </p-inputgroup>
      </div>

      <div class="field-checkbox remember">
        <p-checkbox [(ngModel)]="remember" binary="true"></p-checkbox>
        <label>Recordarme</label>
      </div>

      <button
        pButton
        label="Ingresar"
        icon="pi pi-sign-in"
        class="login-btn"
        severity="info"
        (click)="login()">
      </button>
    </div>

    <div class="login-footer">
      <a href="#">¿Olvidaste tu contraseña?</a>
    </div>
  </p-card>
</div>
