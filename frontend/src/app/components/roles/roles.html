<p-table 
  [value]="datos_roles()"
  [paginator]="true"
  [rows]="5"
  responsiveLayout="scroll">

  <ng-template pTemplate="header">
    <tr>
      <th>N°</th>
      <th>Rol</th>
      <th>Acciones</th>
    </tr>
  </ng-template>

  <ng-template pTemplate="body" let-rol let-rowIndex="rowIndex">
    <tr>
      <td>{{ rowIndex + 1 }}</td>
      <td>{{ rol.rol }}</td>
      <td>
        <button 
          pButton 
          icon="pi pi-pencil"
          severity="info"
          class="p-button-sm"
          (click)="editarRol(rol)">
        </button>

        <button 
          pButton 
          icon="pi pi-trash"
          severity="danger"
          class="p-button-sm ml-2"
          (click)="eliminarRol(rol.id)">
        </button>
      </td>
    </tr>
  </ng-template>

</p-table>


<!-- editar -->
<p-dialog 
  header="Editar Rol"
  [modal]="true"
  [(visible)]="modalEditar"
  [style]="{ width: '25rem' }">

  <div class="flex items-center gap-4 mb-4">
    <label class="font-semibold w-24">Rol</label>
    <input
      pInputText
      class="flex-auto"
      [(ngModel)]="rolSeleccionado.rol"
    />
  </div>

  <div class="flex justify-center gap-2">
    <p-button 
      label="Cancel"
      severity="danger"
      (click)="modalEditar = false">
    </p-button>
    <p-button 
      label="Actualizar"
      (click)="actualizarRol()">
    </p-button>
  </div>

</p-dialog>
