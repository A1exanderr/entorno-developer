services:
  db_ce_pro:
    image: postgis/postgis:17-3.4
    container_name: db_ce_pro
    restart: unless-stopped
    environment:
      POSTGRES_DB: db_developer
      POSTGRES_USER: dba
      POSTGRES_PASSWORD: sys
    ports:
      - "5432:5432"
    networks:
      - app_network
    volumes:
      - pgce_pro:/var/lib/postgresql/data
  backend_ce_pro:
    build:
      context: ./src/backend
      dockerfile: ../../Dockerfile.nodejs
    container_name: backend_ce_pro
    restart: unless-stopped
    environment:
      NODE_ENV: production
      PORT: 3000
    networks:
      - app_network
    depends_on:
      - db_ce_pro
  frontend_ce_pro:
    build:
      context: ./src/frontend
      dockerfile: ../../Dockerfile.angular
    container_name: frontend_ce_pro
    restart: unless-stopped
    networks:
      - app_network
    depends_on:
      - backend_ce_pro
networks:
  app_network:
    external: true
volumes:
  pgce_pro: